name: Build, deploy, and test backend

on:
  push:
    branches: ["main"]
    paths:
      - "DjangoProject/**"
      - "ecs-task-definition.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: nz-birdsound-backend
  ECR_REGISTRY: 912424953824.dkr.ecr.ap-southeast-2.amazonaws.com
  ECS_CLUSTER: nz-birdsound-cluster
  ECS_SERVICE: nz-birdsound-backend-service
  API_BASE_URL: http://nz-birdsound-alb-1901341595.ap-southeast-2.elb.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::912424953824:role/github-actions-ecr-nz-birdsound
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: DjangoProject
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} .
          docker tag $ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::912424953824:role/github-actions-ecr-nz-birdsound
          aws-region: ${{ env.AWS_REGION }}

      - name: Render immutable image into task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: backend
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Enable failed-deployment rollback
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}"

      - name: Register and deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

  live-tests:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for live tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run live API integration tests
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: python -m pytest tests/live -v
