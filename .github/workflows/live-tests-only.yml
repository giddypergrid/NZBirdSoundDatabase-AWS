name: Live API tests only

on:
  workflow_dispatch:

env:
  API_BASE_URL: http://nz-birdsound-alb-1901341595.ap-southeast-2.elb.amazonaws.com

jobs:
  live-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for live tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run live API integration tests
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: python -m pytest tests/live -v
